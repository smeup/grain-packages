name: smeup-es
version: 0.1.0
grainVersion: 9.0.0
publisher: Smeup LAB
description: Smeup Enterprise Suite
publishedAt: 2026-11-19T10:00:00Z
components:
  - name: kokos-dsl-smeupes
    type: dsl
    repository: https://github.com/smeup/kokos-dsl-smeupes
    ref: develop

  - name: me-java-as400-proxy
    type: micro-executor
    image: 100076361442.dkr.ecr.eu-south-1.amazonaws.com/kokos-java-as400proxy:5.0.0
    configuration:
      instance:
        type: object,
        properties:
          A4P_SERVER: { type: string }
          A4P_USER: { type: string }
          A4P_PASSWORD: { type: string, format: password }
          A4P_ENVIRONMENT: { type: string }
          A4P_CONC_FUN: { type: integer, default: 1 }
          MAX_NUMBER_OF_CELLS: { type: integer, default: 500000 }
        required: [A4P_SERVER, A4P_USER, A4P_PASSWORD, A4P_ENVIRONMENT]
      applicativeDomain:
        type: object
        properties:
          as400Environment: { type: string }
          as400Ccsid: { type: integer }
        required: [as400Environment, as400Ccsid]

  - name: me-java-h53
    type: micro-executor
    image: 100076361442.dkr.ecr.eu-south-1.amazonaws.com/kokos-java-h53:3.0.0
